<!doctype html><html lang="pa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify NGSF Marriage Certificate</title><style>
:root{--navy:#071a33;--blue:#123e70;--gold:#e5b947;--paper:#f3f5f8;--ink:#203047}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 Arial,sans-serif}header{background:linear-gradient(100deg,#050b14,var(--navy),var(--blue));color:white;padding:18px 5%;border-bottom:4px solid var(--gold)}header a{color:#ffe6a2;margin-right:14px}main{width:min(950px,94%);margin:24px auto}.card{background:white;border:1px solid #d8e0ea;border-top:5px solid var(--gold);border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 8px 22px #071a3310}h1,h2{color:var(--navy)}label{display:block;font-weight:700;margin:12px 0 5px}input,textarea,select{width:100%;padding:12px;border:1px solid #c6d1df;border-radius:8px;font:inherit}button{border:0;border-radius:8px;background:var(--gold);color:var(--navy);font-weight:800;padding:11px 16px;margin:8px 6px 0 0;cursor:pointer}button.secondary{background:var(--blue);color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.note{background:#fff8e5;border-left:4px solid var(--gold);padding:12px}.msg{padding:12px;border-radius:8px;margin:12px 0;background:#eaf5ed}.err{background:#ffeded;color:#8b1e2b}.item{border:1px solid #d9e1ec;border-radius:10px;padding:14px;margin:12px 0}.hidden{display:none!important}.muted{color:#68778b;font-size:13px}@media(max-width:620px){.grid{grid-template-columns:1fr}.card{padding:15px}}
</style></head><body><header><strong>NGSF Certificate Verification</strong><nav><a href="index.html">Home</a><a href="marriage-application.html">Apply</a></nav></header><main><section class="card"><h1>ਵਿਆਹ ਸਰਟੀਫਿਕੇਟ ਦੀ ਆਨਲਾਈਨ ਜਾਂਚ</h1><p>Enter certificate number to verify an NGSF-issued institutional certificate.</p><form id="vform"><label>Certificate Number</label><input id="cert" required placeholder="NGSF-MC-2026-XXXXXXXX"><button>Verify Certificate</button></form><div id="result" aria-live="polite"></div><p class="muted">ਇਹ ਜਾਂਚ ਸਿਰਫ਼ NGSF ਦੇ ਰਿਕਾਰਡ ਦੀ ਪੁਸ਼ਟੀ ਕਰਦੀ ਹੈ; ਸਰਕਾਰੀ ਰਜਿਸਟ੍ਰੇਸ਼ਨ ਦੀ ਨਹੀਂ।</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient("https://oqelvpojoaylmwdbmwcn.supabase.co","sb_publishable_rgbSAlgeSBnVaBtYWlQOdA_ltIW3Hka");</script><script>
const p=new URLSearchParams(location.search);if(p.get("cert"))document.getElementById("cert").value=p.get("cert");
document.getElementById("vform").addEventListener("submit",async e=>{e.preventDefault();const n=document.getElementById("cert").value.trim(),o=document.getElementById("result");o.className="msg";o.textContent="Checking…";const {data,error}=await db.from("ngsf_marriage_certificate_verifications").select("certificate_number,groom_full_name,bride_full_name,marriage_date,issued_date,status").eq("certificate_number",n).maybeSingle();if(error||!data||data.status!=="active"){o.className="msg err";o.textContent="ਇਹ ਸਰਟੀਫਿਕੇਟ ਰਿਕਾਰਡ ਨਹੀਂ ਮਿਲਿਆ ਜਾਂ ਰੱਦ ਕੀਤਾ ਗਿਆ ਹੈ।";return}o.replaceChildren();const h=document.createElement("h2");h.textContent="✓ Verified – Active";o.append(h);for(const [k,v] of [["Certificate Number",data.certificate_number],["Groom",data.groom_full_name],["Bride",data.bride_full_name],["Marriage Date",data.marriage_date],["Issue Date",data.issued_date],["Status","Active"]]){const row=document.createElement("p");row.textContent=k+": "+v;o.append(row)}});
</script></body></html>
