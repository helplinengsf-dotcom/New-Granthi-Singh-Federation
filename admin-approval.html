
<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071426">
<title>Admin Approval | NGSF</title>
<style>
:root{--navy:#071426;--blue:#0B2D59;--gold:#F5C542;--light:#F3F6FB;--text:#26364B}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--light);color:var(--text);line-height:1.6}
header{background:var(--navy);color:white;padding:18px 5%;border-bottom:4px solid var(--gold)}
header a{color:var(--gold);text-decoration:none}
main{width:min(1100px,94%);margin:24px auto}
.card{background:white;border:1px solid #d9e2ef;border-top:5px solid var(--gold);border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 5px 18px #0714260d}
h1,h2,h3{color:var(--navy)}
label{display:block;font-weight:bold;margin:12px 0 5px}
input,select{width:100%;padding:12px;border:1px solid #bbc8d8;border-radius:8px;font-size:16px;background:white}
button{border:0;border-radius:8px;padding:11px 15px;margin:8px 5px 0 0;background:var(--gold);color:var(--navy);font-size:15px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
button.secondary{background:var(--blue);color:white}
button.danger{background:#8d2020;color:white}
.status{padding:12px;border-radius:8px;background:#e8f6ec;margin:12px 0;overflow-wrap:anywhere}
.error{padding:12px;border-radius:8px;background:#ffeded;color:#8d2020;margin:12px 0;overflow-wrap:anywhere}
.hidden{display:none!important}
.muted{font-size:13px;color:#657386;overflow-wrap:anywhere}
.item{border:1px solid #d9e2ef;border-radius:10px;padding:16px;margin:14px 0;overflow-wrap:anywhere}
.item p{margin:7px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:Arial,sans-serif;background:#f5f7fa;padding:12px;border-radius:8px}
@media(max-width:650px){.grid{grid-template-columns:1fr}main{width:94%}.card{padding:15px}}
</style>
</head>
<body>
<header>
  <strong>NGSF — Admin Approval</strong><br>
  <a href="index.html">Home</a> · <a href="membership.html">Membership</a>
</header>

<main>
  <section class="card">
    <h1>Membership Approval Dashboard</h1>
    <p>ਇਹ ਪੇਜ ਸਿਰਫ਼ ਅਧਿਕਾਰਤ NGSF Admin ਲਈ ਹੈ।</p>

    <div id="loginArea">
      <label for="email">Admin Email</label>
      <input id="email" type="email" autocomplete="username" placeholder="Admin email">

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Password">

      <button id="loginBtn">Admin Login</button>
      <button id="resetBtn" class="secondary">Forgot Password</button>
    </div>

    <div id="adminArea" class="hidden">
      <p class="status" id="adminIdentity"></p>
      <button id="reloadBtn">Refresh Applications</button>
      <button id="logoutBtn" class="danger">Sign Out</button>
    </div>

    <div id="message" role="status" aria-live="polite"></div>
  </section>

  <section id="dashboard" class="card hidden">
    <h2>Applications</h2>
    <div class="grid">
      <div>
        <label for="filterStatus">Filter by Status</label>
        <select id="filterStatus">
          <option value="">All statuses</option>
          <option>Pending</option>
          <option>Under Review</option>
          <option>Approved</option>
          <option>Rejected</option>
        </select>
      </div>
      <div>
        <label for="search">Search</label>
        <input id="search" type="search" placeholder="Name, email, phone or ID">
      </div>
    </div>
    <div id="applications">Applications ਲੋਡ ਹੋ ਰਹੀਆਂ ਹਨ…</div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://oqelvpojoaylmwdbmwcn.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_rgbSAlgeSBnVaBtYWlQOdA_ltIW3Hka";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const $ = id => document.getElementById(id);
const allowedStatuses = ["Pending", "Under Review", "Approved", "Rejected"];
let currentUser = null;
let allApplications = [];
let busy = false;

function message(text, isError=false) {
  $("message").innerHTML = "";
  const box = document.createElement("div");
  box.className = isError ? "error" : "status";
  box.textContent = text;
  $("message").appendChild(box);
}
function clearMessage(){ $("message").innerHTML = ""; }

function setLoggedIn(user, isAdmin) {
  currentUser = user || null;
  $("loginArea").classList.toggle("hidden", !!user);
  $("adminArea").classList.toggle("hidden", !isAdmin);
  $("dashboard").classList.toggle("hidden", !isAdmin);
  $("adminIdentity").textContent =
    isAdmin ? "Authorized Admin: " + user.email : "";
}

function safeText(value) {
  return value === null || value === undefined || value === "" ? "—" : String(value);
}

async function verifyAdmin(user) {
  // Admin role is checked against the protected database table.
  // Do not trust a role supplied in a public signup form or user metadata.
  const { data, error } = await db
    .from("ngsf_admins")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();

  if (error) {
    setLoggedIn(user, false);
    message("Admin verification failed: " + error.message, true);
    await db.auth.signOut();
    return false;
  }

  if (!data) {
    setLoggedIn(null, false);
    message("Access denied. ਇਹ account ngsf_admins ਵਿੱਚ authorized Admin ਵਜੋਂ ਦਰਜ ਨਹੀਂ ਹੈ।", true);
    await db.auth.signOut();
    return false;
  }

  setLoggedIn(user, true);
  message("Admin verification successful.");
  await loadApplications();
  return true;
}

async function loadApplications() {
  if (!currentUser) return;

  $("applications").textContent = "Applications ਲੋਡ ਹੋ ਰਹੀਆਂ ਹਨ…";

  const { data, error } = await db
    .from("ngsf_member_registrations")
    .select("id, user_id, full_name, phone, email, city, interest, message, status, created_at")
    .order("created_at", { ascending: false })
    .limit(200);

  if (error) {
    $("applications").textContent = "";
    message("Applications ਲੋਡ ਨਹੀਂ ਹੋਈਆਂ: " + error.message, true);
    return;
  }

  allApplications = data || [];
  renderApplications();
}

function renderApplications() {
  const target = $("applications");
  target.innerHTML = "";

  const filter = $("filterStatus").value;
  const query = $("search").value.trim().toLowerCase();

  const rows = allApplications.filter(app => {
    const statusMatch = !filter || app.status === filter;
    const haystack = [
      app.id, app.full_name, app.phone, app.email, app.city, app.interest
    ].map(safeText).join(" ").toLowerCase();
    return statusMatch && (!query || haystack.includes(query));
  });

  if (!rows.length) {
    target.textContent = "ਇਸ filter ਲਈ ਕੋਈ application ਨਹੀਂ ਮਿਲੀ।";
    return;
  }

  rows.forEach(app => {
    const card = document.createElement("article");
    card.className = "item";

    const title = document.createElement("h3");
    title.textContent = safeText(app.full_name);

    const id = document.createElement("p");
    id.textContent = "Application ID: " + safeText(app.id);

    const submitted = document.createElement("p");
    submitted.textContent = "Submitted: " +
      (app.created_at ? new Date(app.created_at).toLocaleString() : "—");

    const details = document.createElement("pre");
    details.textContent =
      "Phone: " + safeText(app.phone) + "\n" +
      "Email: " + safeText(app.email) + "\n" +
      "City / District: " + safeText(app.city) + "\n" +
      "Interest: " + safeText(app.interest) + "\n" +
      "Message: " + safeText(app.message);

    const statusLabel = document.createElement("label");
    statusLabel.textContent = "Application Status";

    const statusSelect = document.createElement("select");
    allowedStatuses.forEach(status => {
      const option = document.createElement("option");
      option.value = status;
      option.textContent = status;
      statusSelect.appendChild(option);
    });
    statusSelect.value = allowedStatuses.includes(app.status)
      ? app.status : "Pending";

    const save = document.createElement("button");
    save.textContent = "Save Status";
    save.addEventListener("click", () => updateStatus(app, statusSelect, save));

    card.append(title, id, submitted, details, statusLabel, statusSelect, save);
    target.appendChild(card);
  });
}

async function updateStatus(app, select, button) {
  if (busy) return;
  const newStatus = select.value;

  if (!allowedStatuses.includes(newStatus)) {
    return message("Invalid status.", true);
  }

  if (!confirm("Application status ਨੂੰ '" + newStatus + "' ਕਰਨਾ ਹੈ?")) return;

  busy = true;
  button.disabled = true;
  clearMessage();

  // RLS must independently verify the signed-in user's Admin permission.
  const { data, error } = await db
    .from("ngsf_member_registrations")
    .update({ status: newStatus })
    .eq("id", app.id)
    .select("id, status")
    .maybeSingle();

  busy = false;
  button.disabled = false;

  if (error) {
    message("Status update ਨਹੀਂ ਹੋਇਆ: " + error.message, true);
    return;
  }

  if (!data) {
    message("ਕੋਈ row update ਨਹੀਂ ਹੋਈ। RLS policy ਅਤੇ Admin access ਜਾਂਚੋ।", true);
    return;
  }

  message("Application status updated: " + data.status);
  await loadApplications();
}

$("loginBtn").addEventListener("click", async () => {
  if (busy) return;
  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || !password) {
    message("Admin email ਅਤੇ password ਭਰੋ।", true);
    return;
  }

  busy = true;
  $("loginBtn").disabled = true;
  clearMessage();

  const { data, error } = await db.auth.signInWithPassword({ email, password });

  busy = false;
  $("loginBtn").disabled = false;

  if (error) return message(error.message, true);
  await verifyAdmin(data.user);
});

$("resetBtn").addEventListener("click", async () => {
  const email = $("email").value.trim();
  if (!email) return message("ਪਹਿਲਾਂ Admin email ਭਰੋ।", true);

  const redirectTo = location.origin + location.pathname.replace(
    /[^/]*$/, "reset-password.html"
  );

  const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo });
  if (error) return message(error.message, true);
  message("ਜੇ ਇਹ email account ਮੌਜੂਦ ਹੈ, ਤਾਂ password reset instructions ਭੇਜਣ ਦੀ ਬੇਨਤੀ ਹੋ ਗਈ ਹੈ।");
});

$("reloadBtn").addEventListener("click", loadApplications);
$("filterStatus").addEventListener("change", renderApplications);
$("search").addEventListener("input", renderApplications);

$("logoutBtn").addEventListener("click", async () => {
  await db.auth.signOut();
  currentUser = null;
  allApplications = [];
  setLoggedIn(null, false);
  $("applications").textContent = "";
  message("ਤੁਸੀਂ Sign Out ਹੋ ਗਏ ਹੋ।");
});

async function initialize() {
  const { data, error } = await db.auth.getSession();
  if (error) return message(error.message, true);
  if (data.session) await verifyAdmin(data.session.user);
}

db.auth.onAuthStateChange((event) => {
  if (event === "SIGNED_OUT") {
    currentUser = null;
    allApplications = [];
    setLoggedIn(null, false);
  }
});

if (SUPABASE_PUBLISHABLE_KEY === "sb_publishable_rgbSAlgeSBnVaBtYWlQOdA_ltIW3Hka) {
  message("ਕੋਡ ਵਿੱਚ ਆਪਣੀ Supabase publishable key ਪਾਓ।", true);
} else {
  initialize();
}
</script>
</body>
</html>
