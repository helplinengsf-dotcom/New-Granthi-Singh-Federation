<!doctype html><html lang="pa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426"><title>Verify NGSF Appointment Letter</title><style>:root{--navy:#071426;--blue:#0b2d59;--gold:#d6aa25}body{margin:0;background:#eef2f7;font:16px/1.6 Arial;color:#172033}header{background:var(--navy);color:white;padding:20px 5%;border-bottom:5px solid var(--gold)}main{max-width:680px;margin:28px auto;padding:0 14px}.card{background:white;padding:24px;border:1px solid #d9e2ef;border-top:5px solid var(--gold);border-radius:12px}h1,h2{color:var(--blue)}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:7px;font:inherit;margin:8px 0}input{border:1px solid #bdc9d8}button{border:0;background:var(--blue);color:white;font-weight:bold}#result{padding:14px;border-radius:8px;overflow-wrap:anywhere}.good{background:#e6f6e9;color:#16592b}.bad{background:#fff0f0;color:#8d2020}.line{border-bottom:1px solid #e3e7ed;padding:8px 0}</style></head><body><header><h1 style="color:white;margin:0">NGSF Appointment Verification</h1><div>New Granthi Singh Federation</div></header><main><section class="card"><h2>Verify Appointment Letter</h2><p>QR code ਤੋਂ ਖੁੱਲ੍ਹਿਆ token ਇੱਥੇ ਆਪਣੇ ਆਪ ਭਰ ਜਾਵੇਗਾ।</p><label for="token">Verification token</label><input id="token" placeholder="Verification token (UUID)"><button id="check">Verify Letter</button><div id="result" aria-live="polite"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{"use strict";const db=supabase.createClient("https://oqelvpojoaylmwdbmwcn.supabase.co","sb_publishable_rgbSAlgeSBnVaBtYWlQOdA_ltIW3Hka");const $=id=>document.getElementById(id);async function verify(){const token=$("token").value.trim();const result=$("result");result.className="";result.textContent="Checking official database...";if(!/^[0-9a-f-]{36}$/i.test(token)){result.className="bad";result.textContent="Invalid verification token.";return}const {data,error}=await db.rpc("verify_ngsf_appointment_letter",{p_token:token});result.replaceChildren();if(error||!data||!data.length){result.className="bad";result.textContent="Record not found or verification is unavailable. Please contact the Federation.";return}const r=data[0];result.className=r.status==="approved"?"good":"bad";const h=document.createElement("h2");h.textContent=r.status==="approved"?"VERIFIED — APPROVED":"NOTICE — LETTER REVOKED";result.appendChild(h);[["Letter Number",r.letter_number],["Name",r.full_name],["Designation",r.designation],["State",r.state_name||"—"],["District",r.district_name||"—"],["Appointment Date",r.appointment_date||"—"],["Term End Date",r.term_end_date||"—"],["Current Status",r.status]].forEach(([k,v])=>{const p=document.createElement("div");p.className="line";const b=document.createElement("b");b.textContent=k+": ";p.appendChild(b);p.appendChild(document.createTextNode(v));result.appendChild(p)});const note=document.createElement("p");note.textContent="This result is retrieved from the NGSF online verification database. If any detail appears incorrect, contact the official Federation office.";result.appendChild(note)}$("check").onclick=verify;const token=new URLSearchParams(location.search).get("token");if(token){$("token").value=token;verify()}})();</script></body></html>
