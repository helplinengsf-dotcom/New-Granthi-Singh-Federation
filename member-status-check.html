
<!DOCTYPE html>
<html lang="pa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Member Status | NGSF</title>
  <style>
    body{margin:0;background:#edf3fa;color:#12283c;font-family:Arial,sans-serif}
    header{background:#102e46;color:white;padding:22px;text-align:center}
    main{max-width:760px;margin:28px auto;padding:20px}
    .card{background:white;padding:24px;border-radius:18px;border-top:7px solid #f4c644;margin-bottom:20px;box-shadow:0 5px 18px #0001}
    input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border-radius:9px;font-size:16px}
    input{border:1px solid #b8c5d4}
    button{background:#f4c644;border:0;font-weight:bold;cursor:pointer}
    .secondary{background:#102e46;color:white}
    .notice{padding:14px;background:#fff6d9;border-radius:9px;overflow-wrap:anywhere}
    .status{font-weight:bold;font-size:20px}
    a{color:#164d76}
  </style>
</head>
<body>
<header>
  <h1>New Granthi Singh Federation</h1>
  <p>Member Application Status</p>
</header>
<main>
  <section class="card">
    <h2>ਮੈਂਬਰ Login</h2>
    <p>ਆਪਣੀ membership application ਦਾ status ਦੇਖਣ ਲਈ Login ਕਰੋ।</p>
    <form id="loginForm">
      <label>Email Address</label>
      <input id="email" type="email" autocomplete="username" required>
      <label>Password</label>
      <input id="password" type="password"
        autocomplete="current-password" required>
      <button type="submit">Login</button>
    </form>
    <button class="secondary" id="forgot">Forgot Password</button>
    <button class="secondary" id="refresh" hidden>Refresh Status</button>
    <button class="secondary" id="logout" hidden>Sign Out</button>
    <p id="message" role="status" aria-live="polite"></p>
  </section>

  <section class="card" id="results" hidden>
    <h2>ਮੇਰੀਆਂ ਅਰਜ਼ੀਆਂ</h2>
    <div id="applications"></div>
  </section>
  <p><a href="index.html">← Home</a></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://oqelvpojoaylmwdbmwcn.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_rgbSAlgeSBnVaBtYWlQOdA_ltIW3Hka";

const db = window.supabase.createClient(
  SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY
);

const $ = id => document.getElementById(id);
const say = text => { $("message").textContent = text; };

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  say("Login ਹੋ ਰਿਹਾ ਹੈ...");
  const { error } = await db.auth.signInWithPassword({
    email: $("email").value.trim(),
    password: $("password").value
  });
  if (error) { say("Login error: " + error.message); return; }
  await loadApplications();
});

$("forgot").addEventListener("click", async () => {
  const email = $("email").value.trim();
  if (!email) { say("ਪਹਿਲਾਂ ਆਪਣੀ email ਲਿਖੋ।"); return; }
  const { error } = await db.auth.resetPasswordForEmail(email, {
    redirectTo: location.origin + location.pathname.replace(
      "member-status.html", "reset-password.html"
    )
  });
  say(error ? error.message : "ਜੇ email registered ਹੈ, reset instructions ਭੇਜ ਦਿੱਤੀਆਂ ਗਈਆਂ ਹਨ।");
});

$("refresh").addEventListener("click", loadApplications);

$("logout").addEventListener("click", async () => {
  await db.auth.signOut();
  $("results").hidden = true;
  $("logout").hidden = true;
  $("refresh").hidden = true;
  $("loginForm").hidden = false;
  say("ਤੁਸੀਂ Sign Out ਹੋ ਗਏ ਹੋ।");
});

async function loadApplications() {
  say("ਤੁਹਾਡੀਆਂ ਅਰਜ਼ੀਆਂ ਲੋਡ ਹੋ ਰਹੀਆਂ ਹਨ...");
  const { data: { user }, error: authError } = await db.auth.getUser();

  if (authError || !user) {
    say("ਕਿਰਪਾ ਕਰਕੇ ਆਪਣੇ Member Account ਵਿੱਚ Login ਕਰੋ।");
    return;
  }

  // RLS ensures a member can read only their own rows.
  const { data, error } = await db
    .from("ngsf_member_registrations")
    .select("id,full_name,mobile,district,state,status,created_at")
    .eq("user_id", user.id)
    .order("created_at", { ascending: false });

  if (error) {
    say("Applications ਨਹੀਂ ਲੋਡ ਹੋਈਆਂ: " + error.message);
    return;
  }

  $("loginForm").hidden = true;
  $("logout").hidden = false;
  $("refresh").hidden = false;
  $("results").hidden = false;

  const area = $("applications");
  area.replaceChildren();

  if (!data.length) {
    area.textContent = "ਤੁਹਾਡੇ account ਨਾਲ ਕੋਈ membership application ਨਹੀਂ ਮਿਲੀ।";
  } else {
    data.forEach(item => {
      const box = document.createElement("article");
      box.className = "notice";

      const name = document.createElement("h3");
      name.textContent = item.full_name || "Membership Application";

      const status = document.createElement("p");
      status.className = "status";
      status.textContent = "Status: " + item.status;

      const date = document.createElement("p");
      date.textContent = "Submitted: " +
        (item.created_at ? new Date(item.created_at).toLocaleString() : "N/A");

      box.append(name, status, date);
      area.append(box);
    });
  }
  say("Status update ਹੋ ਗਿਆ ਹੈ।");
}

(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (session) await loadApplications();
})();
</script>
</body>
</html>
