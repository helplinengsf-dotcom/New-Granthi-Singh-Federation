<!doctype html><html lang="pa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1730"><title>NGSF Exam Certificate Verification</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#17365c,#0b1730 55%,#050b16);font-family:Arial,sans-serif;color:#f2f6fc;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(560px,100%);background:#111f3d;border:1px solid #294568;border-top:5px solid #e9bd4b;border-radius:16px;padding:24px;box-shadow:0 12px 35px #0005}h1{font-size:22px;color:#ffe39a;margin:4px 0 8px}.sub{color:#b8c7dc;font-size:14px;line-height:1.6}.status{padding:10px 12px;border-radius:8px;font-weight:bold;margin:18px 0}.ok{background:#123d36;color:#b9f5d6;border:1px solid #2e8e73}.bad{background:#481d28;color:#ffd8df;border:1px solid #9f4354}.wait{background:#183653;color:#d6eaff;border:1px solid #3c6d9e}.row{border-bottom:1px solid #294568;padding:10px 0;display:flex;gap:12px;justify-content:space-between}.row span:first-child{color:#b8c7dc}.row span:last-child{text-align:right;overflow-wrap:anywhere}a{color:#ffe39a}footer{font-size:12px;color:#9fb0c8;margin-top:22px;text-align:center}</style></head><body><main class="card"><h1>NEW GRANTHI SINGH FEDERATION</h1><div class="sub">Official Exam Certificate Verification</div><div id="status" class="status wait">Certificate record ਦੀ ਜਾਂਚ ਹੋ ਰਹੀ ਹੈ…</div><div id="details"></div><footer>© 2026 New Granthi Singh Federation</footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient("https://oqelvpojoaylmwdbmwcn.supabase.co","sb_publishable_rgbSAlgeSBnVaBtYWlQOdA_ltIW3Hka");const s=document.getElementById("status"),d=document.getElementById("details");function status(t,k){s.textContent=t;s.className="status "+k}function row(k,v){const x=document.createElement("div"),a=document.createElement("span"),b=document.createElement("span");x.className="row";a.textContent=k;b.textContent=v||"—";x.append(a,b);d.append(x)}(async()=>{const no=new URLSearchParams(location.search).get("no");if(!no){status("Certificate Number URL ਵਿੱਚ ਨਹੀਂ ਹੈ।","bad");return}const {data,error}=await db.from("ngsf_exam_certificates").select("certificate_number,recipient_name,exam_name,course_name,result_grade,issue_date,status").eq("certificate_number",no).maybeSingle();if(error){status("Verification ਇਸ ਵੇਲੇ ਉਪਲਬਧ ਨਹੀਂ। Federation office ਨਾਲ ਸੰਪਰਕ ਕਰੋ।","bad");return}if(!data){status("Certificate Number ਦਾ record ਨਹੀਂ ਮਿਲਿਆ।","bad");return}if(data.status==="Issued")status("✓ VALID — ISSUED EXAM CERTIFICATE","ok");else status("REVOKED — ਇਹ certificate valid ਨਹੀਂ ਹੈ।","bad");row("Certificate Number",data.certificate_number);row("Name",data.recipient_name);row("Exam",data.exam_name);row("Course / Class",data.course_name);row("Result / Grade",data.result_grade);row("Issue Date",data.issue_date);row("Status",data.status)})().catch(()=>status("Technical issue: verification ਨਹੀਂ ਹੋ ਸਕੀ।","bad"));</script></body></html>
