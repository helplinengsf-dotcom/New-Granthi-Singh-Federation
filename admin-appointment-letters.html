<!doctype html><html lang="pa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NGSF Admin — Appointment Letters</title><style>:root{--navy:#071426;--blue:#0b2d59;--gold:#d6aa25}*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#172033;font:16px/1.5 Arial}header{background:var(--navy);color:white;padding:20px 5%;border-bottom:5px solid var(--gold)}main{max-width:1100px;margin:24px auto;padding:0 14px}.card{background:white;padding:20px;border:1px solid #d9e2ef;border-top:4px solid var(--gold);border-radius:12px;margin-bottom:18px}h1,h2{color:var(--blue)}label{display:block;font-weight:bold;margin:9px 0 4px}input{width:100%;padding:10px;border:1px solid #bdc9d8;border-radius:7px;font:inherit}button{border:0;border-radius:7px;padding:11px 15px;margin:8px 6px 0 0;background:var(--blue);color:white;font-weight:bold;cursor:pointer}.gold{background:var(--gold);color:#101827}.danger{background:#8d2020}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{border:1px solid #d9e2ef;padding:14px;border-radius:10px;margin:12px 0;overflow-wrap:anywhere}.status{padding:10px;background:#eef4ff;border-radius:8px;white-space:pre-wrap}@media(max-width:600px){.grid{grid-template-columns:1fr}button{width:100%}}</style></head><body><header><h1 style="color:white;margin:0">NGSF Appointment Letter Admin</h1><p>Admin-only review, issue and revoke</p></header><main><section class="card"><h2>Authorized Admin Login</h2><div class="grid"><div><label>Email</label><input id="email" type="email" autocomplete="username"></div><div><label>Password</label><input id="password" type="password" autocomplete="current-password"></div></div><button id="login">Login</button><button id="logout" class="danger">Logout</button><div id="msg" class="status" role="status">Sign in with your authorized NGSF Admin account.</div></section><section class="card"><h2>Appointment Applications</h2><button id="refresh" class="gold">Refresh Queue</button><div id="queue"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{"use strict";const db=supabase.createClient("https://oqelvpojoaylmwdbmwcn.supabase.co","sb_publishable_rgbSAlgeSBnVaBtYWlQOdA_ltIW3Hka");const $=id=>document.getElementById(id);let authorized=false;const msg=t=>$("msg").textContent=t;async function checkAdmin(){const {data:{user},error}=await db.auth.getUser();if(error||!user){authorized=false;return false}const {data, error:e}=await db.from("ngsf_admins").select("user_id").eq("user_id",user.id).maybeSingle();authorized=!e&&!!data;return authorized} $("login").onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error){msg(error.message);return}if(!(await checkAdmin())){await db.auth.signOut();msg("Access denied: this account is not listed in ngsf_admins.");return}msg("Admin login successful.");await load()};$("logout").onclick=async()=>{await db.auth.signOut();authorized=false;$("queue").replaceChildren();msg("Logged out.")};async function load(){if(!(await checkAdmin())){msg("Please sign in with an authorized NGSF Admin account.");return}const {data,error}=await db.from("ngsf_appointment_letters").select("*").order("created_at",{ascending:false}).limit(200);if(error){msg(error.message);return}const q=$("queue");q.replaceChildren();if(!data.length){q.textContent="No appointment applications.";return}data.forEach(r=>{const item=document.createElement("article");item.className="item";const title=document.createElement("h3");title.textContent=r.full_name+" — "+r.designation;item.appendChild(title);const detail=document.createElement("p");detail.textContent="Status: "+r.status+" | Created: "+new Date(r.created_at).toLocaleString()+" | Letter No.: "+(r.letter_number||"Not issued");item.appendChild(detail);const address=document.createElement("p");address.textContent="Address: "+r.full_address+" | Email: "+r.email+" | Phone: "+(r.phone||"—")+" | State: "+(r.state_name||"—")+" | District: "+(r.district_name||"—");item.appendChild(address);const grid=document.createElement("div");grid.className="grid";const start=document.createElement("div");const startLabel=document.createElement("label");startLabel.textContent="Appointment date";start.appendChild(startLabel);const startInput=document.createElement("input");startInput.type="date";startInput.value=r.appointment_date||new Date().toISOString().slice(0,10);start.appendChild(startInput);grid.appendChild(start);const end=document.createElement("div");const endLabel=document.createElement("label");endLabel.textContent="Term end date";end.appendChild(endLabel);const endInput=document.createElement("input");endInput.type="date";endInput.value=r.term_end_date||"";end.appendChild(endInput);grid.appendChild(end);item.appendChild(grid);if(r.status==="pending"){const approve=document.createElement("button");approve.className="gold";approve.textContent="Approve & Issue Letter";approve.onclick=()=>changeStatus(r.id,"approved",startInput.value,endInput.value);item.appendChild(approve);const reject=document.createElement("button");reject.className="danger";reject.textContent="Reject";reject.onclick=()=>changeStatus(r.id,"rejected");item.appendChild(reject)}if(r.status==="approved"){const revoke=document.createElement("button");revoke.className="danger";revoke.textContent="Revoke Letter";revoke.onclick=()=>changeStatus(r.id,"revoked");item.appendChild(revoke);const verify=document.createElement("a");verify.href="verify-appointment.html?token="+encodeURIComponent(r.verification_token);verify.target="_blank";verify.textContent="Open verification page";verify.style.marginLeft="8px";item.appendChild(verify)}q.appendChild(item)})}async function changeStatus(id,status,start,end){if(!(await checkAdmin())){msg("Admin authorization required.");return}if(!confirm("Confirm "+status+" for this application?"))return;const update={status};if(status==="approved"){update.appointment_date=start||null;update.term_end_date=end||null}const {error}=await db.from("ngsf_appointment_letters").update(update).eq("id",id);if(error){msg(error.message);return}msg(status==="approved"?"Appointment letter issued. Unique letter number assigned by database.":"Application status changed to "+status+".");await load()}$("refresh").onclick=load})();</script></body></html>
