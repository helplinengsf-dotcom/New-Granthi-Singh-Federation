<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | NGSF Admin</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: #fff;
    }

    .panel {
      width: 100%;
      max-width: 430px;
      padding: 28px 22px;
      border: 1px solid #d4af37;
      border-radius: 16px;
      background: #101d30;
      box-shadow: 0 12px 35px #0007;
    }

    h1 {
      margin-top: 0;
      color: #e8c65a;
      text-align: center;
      font-size: 26px;
    }

    p {
      color: #d5dce7;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #53657d;
      border-radius: 8px;
      background: #07111f;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #d4af37;
      color: #07111f;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      margin-top: 18px;
      overflow-wrap: anywhere;
    }

    a { color: #f2d778; }

    .small {
      text-align: center;
      font-size: 13px;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <main class="panel">
    <h1>NGSF Admin</h1>
    <p>Set a new password for your administrator account.</p>

    <form id="resetForm" hidden>
      <label for="password">New password</label>
      <input
        id="password"
        type="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="At least 8 characters"
        required
      >

      <label for="confirmPassword">Confirm new password</label>
      <input
        id="confirmPassword"
        type="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="Enter password again"
        required
      >

      <button id="saveButton" type="submit">
        Update Password
      </button>
    </form>

    <p id="message" role="status" aria-live="polite">
      Checking your password-reset link...
    </p>

    <p class="small">
      <a href="admin-demo.html">Back to Admin Login</a>
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Paste the SAME project URL and publishable key
    // that you already used in admin-demo.html.
    const SUPABASE_URL = "https://oqelvpojoaylmwdbmwcn.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_rgbSAlgeSBnVaBtYWlQOdA_ltIW3Hka";

    const message = document.getElementById("message");
    const form = document.getElementById("resetForm");
    const saveButton = document.getElementById("saveButton");

    let recoveryReady = false;

    if (
      SUPABASE_URL.includes("PASTE_") ||
      SUPABASE_PUBLISHABLE_KEY.includes("PASTE_")
    ) {
      message.textContent =
        "Setup needed: copy the project URL and publishable key from admin-demo.html.";
    } else {
      startPage();
    }

    async function startPage() {
      const client = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
          auth: {
            detectSessionInUrl: true,
            flowType: "implicit",
            persistSession: true,
            autoRefreshToken: true
          }
        }
      );

      function enableForm() {
        recoveryReady = true;
        form.hidden = false;
        message.textContent =
          "Reset link verified. Enter your new password below.";
      }

      client.auth.onAuthStateChange(async (event, session) => {
        if (event === "PASSWORD_RECOVERY" && session) {
          enableForm();
        }
      });

      const { data, error } = await client.auth.getSession();

      if (error) {
        message.textContent =
          "Could not verify this link. Request a new password-reset email.";
        return;
      }

      if (
        data.session &&
        new URLSearchParams(window.location.hash.slice(1))
          .get("type") === "recovery"
      ) {
        enableForm();
      } else {
        message.textContent =
          "Open this page using the password-reset link sent to your email. If the link has expired, request a new one from the Admin Login page.";
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        if (!recoveryReady) {
          message.textContent =
            "Please open a valid password-reset link from your email first.";
          return;
        }

        const password = document.getElementById("password").value;
        const confirmPassword =
          document.getElementById("confirmPassword").value;

        if (password.length < 8) {
          message.textContent =
            "Password must be at least 8 characters.";
          return;
        }

        if (password !== confirmPassword) {
          message.textContent = "The passwords do not match.";
          return;
        }

        saveButton.disabled = true;
        saveButton.textContent = "Updating...";

        const { error: updateError } =
          await client.auth.updateUser({ password });

        if (updateError) {
          message.textContent =
            "Password update failed: " + updateError.message;
          saveButton.disabled = false;
          saveButton.textContent = "Update Password";
          return;
        }

        form.hidden = true;
        message.textContent =
          "Password updated successfully. You can now open Admin Login and sign in with your new password.";
      });
    }
  </script>
</body>
</html>
