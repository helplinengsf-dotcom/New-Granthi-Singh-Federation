<!doctype html>
<html lang="pa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1730"><title>NGSF Member Verification</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#17365c,#0b1730 55%,#050b16);font-family:Arial,sans-serif;color:#f2f6fc;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(560px,100%);background:#111f3d;border:1px solid #294568;border-top:5px solid #e9bd4b;border-radius:16px;padding:24px;box-shadow:0 12px 35px #0005}h1{font-size:22px;color:#ffe39a;margin:4px 0 8px}h2{font-size:19px;margin:16px 0 8px}.sub{color:#b8c7dc;font-size:14px;line-height:1.6}.status{padding:10px 12px;border-radius:8px;font-weight:bold;margin:18px 0}.ok{background:#123d36;color:#b9f5d6;border:1px solid #2e8e73}.bad{background:#481d28;color:#ffd8df;border:1px solid #9f4354}.wait{background:#183653;color:#d6eaff;border:1px solid #3c6d9e}.row{border-bottom:1px solid #294568;padding:10px 0;display:flex;gap:12px;justify-content:space-between}.row span:first-child{color:#b8c7dc}.row span:last-child{text-align:right;overflow-wrap:anywhere}a{color:#ffe39a}footer{font-size:12px;color:#9fb0c8;margin-top:22px;text-align:center}
</style></head><body><main class="card"><h1>NEW GRANTHI SINGH FEDERATION</h1><div class="sub">Official Member Verification</div><div id="status" class="status wait">ਮੈਂਬਰ ਰਿਕਾਰਡ ਦੀ ਜਾਂਚ ਹੋ ਰਹੀ ਹੈ…</div><div id="details"></div><footer>© 2026 New Granthi Singh Federation · QR Verification</footer></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://oqelvpojoaylmwdbmwcn.supabase.co","sb_publishable_rgbSAlgeSBnVaBtYWlQOdA_ltIW3Hka");
const statusEl=document.getElementById("status"),details=document.getElementById("details");
function showStatus(text,kind){statusEl.textContent=text;statusEl.className="status "+kind}
function row(label,value){const d=document.createElement("div");d.className="row";const a=document.createElement("span"),b=document.createElement("span");a.textContent=label;b.textContent=value||"—";d.append(a,b);details.append(d)}
(async()=>{const id=new URLSearchParams(location.search).get("id");if(!id||!/^[0-9a-f-]{36}$/i.test(id)){showStatus("ਗਲਤ ਜਾਂ ਅਧੂਰਾ verification link ਹੈ।","bad");return}const {data,error}=await db.from("ngsf_public_member_verification").select("id,full_name,district,state,designation,status").eq("id",id).maybeSingle();if(error){showStatus("Verification ਇਸ ਵੇਲੇ ਉਪਲਬਧ ਨਹੀਂ ਹੈ। ਕਿਰਪਾ ਕਰਕੇ Federation office ਨਾਲ ਸੰਪਰਕ ਕਰੋ।","bad");return}if(!data){showStatus("ਇਸ Member ID ਦਾ Approved public record ਨਹੀਂ ਮਿਲਿਆ। ਕਿਰਪਾ ਕਰਕੇ Admin ਤੋਂ ID Card ਅਤੇ Membership Status ਦੀ ਪੁਸ਼ਟੀ ਕਰਵਾਓ।","bad");return}if(data.status!=="Approved"){showStatus("ਇਹ ਮੈਂਬਰ ਇਸ ਵੇਲੇ Approved ਨਹੀਂ ਹੈ।","bad")}else{showStatus("✓ VERIFIED — APPROVED MEMBER","ok")}row("Member ID",String(data.id).slice(0,8).toUpperCase());row("Name",data.full_name);row("Designation / ਅਹੁਦਾ",data.designation);row("District",data.district);row("State",data.state);row("Status",data.status)})().catch(()=>showStatus("Technical issue: verification ਨਹੀਂ ਹੋ ਸਕੀ। ਬਾਅਦ ਵਿੱਚ ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ।","bad"));
</script>  <script src="assets/ngsf-ai-chat.js" defer></script>
</body></html>
