<!doctype html>
<html lang="pa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426"><title>NGSF Manager Portal</title>
<style>
:root{--navy:#071426;--gold:#f5c542;--bg:#f3f6fb;--text:#26364b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 Arial,sans-serif}header{background:var(--navy);color:white;padding:18px 5%;border-bottom:4px solid var(--gold)}header a{color:var(--gold);margin-right:12px}main{width:min(1000px,94%);margin:24px auto}.card{background:white;border:1px solid #d9e2ef;border-top:5px solid var(--gold);border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 5px 18px #0714260d}h1,h2{color:var(--navy);margin-top:0}label{display:block;font-weight:bold;margin:10px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #bbc8d8;border-radius:8px;font:inherit;background:white}button{border:0;border-radius:8px;padding:11px 15px;margin:8px 6px 0 0;background:var(--gold);color:var(--navy);font-weight:bold;font-size:15px;cursor:pointer}button:disabled{opacity:.6}.secondary{background:var(--navy);color:white}.hidden{display:none!important}.msg{padding:11px;background:#e8f6ec;border-radius:8px;margin:12px 0;overflow-wrap:anywhere}.err{background:#ffeded;color:#8d2020}.item{border:1px solid #d9e2ef;border-radius:10px;padding:12px;margin:10px 0}.muted{color:#657386;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><header><strong>NGSF — Manager Portal</strong><nav><a href="index.html">Home</a><a href="admin-demo.html">Admin</a><a href="membership.html">Membership</a></nav></header><main>
<section class="card" id="loginCard"><h1>Manager Login</h1><p>ਇਹ ਪੋਰਟਲ ਸਿਰਫ਼ ਸਰਗਰਮ NGSF Manager account ਲਈ ਹੈ।</p><form id="loginForm"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button id="loginBtn">Login</button></form><div id="msg" class="msg" aria-live="polite"></div></section>
<div id="portal" class="hidden"><section class="card"><h1>Manager Dashboard</h1><div id="who" class="msg"></div><button id="refresh" class="secondary">Refresh data</button><button id="logout">Sign Out</button></section>
<section class="card"><h2>Area Content / News / Events</h2><p class="muted">ਇਹ ਰਿਕਾਰਡ ਤੁਹਾਡੇ assigned area ਤੱਕ ਸੀਮਿਤ ਹਨ। ਨਵੀਂ entry ਪਹਿਲਾਂ Draft ਵਜੋਂ ਬਣਦੀ ਹੈ।</p><div class="grid"><div><label>Content type</label><select id="type"><option value="news">News</option><option value="event">Event</option><option value="activity">Activity</option><option value="announcement">Announcement</option></select></div><div><label>Title</label><input id="title" maxlength="200" required></div></div><label>Details</label><textarea id="body" rows="4" maxlength="5000"></textarea><button id="addContent">Add Draft</button><div id="contentList"></div></section>
<section class="card"><h2>Area CSR Projects</h2><div class="grid"><div><label>Project title</label><input id="projectTitle" maxlength="200"></div><div><label>Company / donor (optional)</label><input id="company" maxlength="200"></div><div><label>Proposed budget (₹)</label><input id="budget" type="number" min="0" step=".01" value="0"></div><div><label>Beneficiary target</label><input id="target" type="number" min="0" step="1" value="0"></div></div><label>Objective</label><textarea id="objective" rows="3" maxlength="3000"></textarea><button id="addProject">Create Draft Project</button><div id="projectList"></div></section></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL="https://oqelvpojoaylmwdbmwcn.supabase.co";
const KEY="sb_publishable_rgbSAlgeSBnVaBtYWlQOdA_ltIW3Hka";
const db=supabase.createClient(URL,KEY);let user=null,profile=null;
const $=id=>document.getElementById(id);
function msg(s,bad=false){$("msg").textContent=s;$("msg").className="msg"+(bad?" err":"")}
function esc(v){return String(v??"—").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function show(on){$("loginCard").classList.toggle("hidden",on);$("portal").classList.toggle("hidden",!on)}
async function verify(u){const {data,error}=await db.from("ngsf_profiles").select("user_id,full_name,email,role,area_id,is_active").eq("user_id",u.id).maybeSingle();if(error){msg("Profile check failed: "+error.message,true);await db.auth.signOut();return}if(!data||data.role!=="manager"||!data.is_active||!data.area_id){msg("Access denied: active Manager role ਅਤੇ assigned area ਲਾਜ਼ਮੀ ਹਨ।",true);await db.auth.signOut();return}user=u;profile=data;$("who").textContent="Signed in: "+(data.full_name||u.email)+" · Manager · Area: "+data.area_id;show(true);await refreshAll()}
async function refreshAll(){await Promise.all([loadContent(),loadProjects()])}
async function loadContent(){const box=$("contentList");box.textContent="Loading…";const {data,error}=await db.from("ngsf_content").select("id,content_type,title,body,status,created_at").eq("area_id",profile.area_id).order("created_at",{ascending:false}).limit(100);if(error){box.textContent="Content load failed: "+error.message;return}box.replaceChildren();if(!data.length){box.textContent="ਇਸ area ਵਿੱਚ ਕੋਈ content ਨਹੀਂ।";return}data.forEach(r=>{const el=document.createElement("article");el.className="item";const body=typeof r.body==="object"?JSON.stringify(r.body):r.body;el.innerHTML="<strong>"+esc(r.title)+"</strong><div>"+esc(r.content_type)+" · "+esc(r.status)+"</div><p>"+esc(body)+"</p>";const st=document.createElement("select");["draft","submitted","under_review","approved","rejected"].forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;st.append(o)});st.value=r.status;const b=document.createElement("button");b.textContent="Save status";b.onclick=async()=>{const {error}=await db.from("ngsf_content").update({status:st.value,updated_at:new Date().toISOString()}).eq("id",r.id);if(error)alert("Update failed: "+error.message);else loadContent()};el.append(st,b);box.append(el)})}
$("addContent").onclick=async()=>{const title=$("title").value.trim();if(!title)return alert("Title required");const {error}=await db.from("ngsf_content").insert({content_type:$("type").value,title,body:{text:$("body").value.trim()},area_id:profile.area_id,status:"draft",created_by:user.id});if(error)return alert("Save failed: "+error.message);$("title").value="";$("body").value="";await loadContent();alert("Draft saved.")};
async function loadProjects(){const box=$("projectList");box.textContent="Loading…";const {data,error}=await db.from("ngsf_csr_projects").select("id,title,company_name,objective,proposed_budget,beneficiary_target,status,start_date,end_date").eq("area_id",profile.area_id).order("created_at",{ascending:false}).limit(100);if(error){box.textContent="Projects load failed: "+error.message;return}box.replaceChildren();if(!data.length){box.textContent="ਇਸ area ਵਿੱਚ ਕੋਈ CSR project ਨਹੀਂ।";return}data.forEach(p=>{const el=document.createElement("article");el.className="item";el.innerHTML="<strong>"+esc(p.title)+"</strong><div>Status: "+esc(p.status)+" · Budget: ₹"+esc(p.proposed_budget)+" · Target: "+esc(p.beneficiary_target)+"</div><p>"+esc(p.objective)+"</p>";box.append(el)})}
$("addProject").onclick=async()=>{const title=$("projectTitle").value.trim(),budget=Number($("budget").value),target=Number($("target").value);if(!title||!Number.isFinite(budget)||budget<0||!Number.isInteger(target)||target<0)return alert("Project title, valid budget and beneficiary target required.");const {error}=await db.from("ngsf_csr_projects").insert({title,company_name:$("company").value.trim()||null,objective:$("objective").value.trim()||null,area_id:profile.area_id,proposed_budget:budget,beneficiary_target:target,status:"draft",created_by:user.id});if(error)return alert("Project save failed: "+error.message);["projectTitle","company","objective"].forEach(id=>$(id).value="");await loadProjects();alert("Draft project created.")};
$("refresh").onclick=refreshAll;$("logout").onclick=async()=>{await db.auth.signOut();user=null;profile=null;show(false);msg("Signed out.")};
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginBtn").disabled=true;const {data,error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});$("loginBtn").disabled=false;if(error){msg("Login failed: "+error.message,true);return}await verify(data.user)};
db.auth.getSession().then(({data,error})=>{if(error)msg(error.message,true);else if(data.session)verify(data.session.user)});
</script></body></html>
