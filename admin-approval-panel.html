<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071426">
<title>NGSF Admin Approval Panel</title>

<style>
:root {
  --navy: #071426;
  --blue: #0B2D59;
  --gold: #F5C542;
  --light: #F3F6FB;
  --text: #26364B;
  --green: #e8f6ec;
  --red: #ffeded;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--light);
  color: var(--text);
  line-height: 1.6;
}

header {
  background: var(--navy);
  color: white;
  padding: 18px 5%;
  border-bottom: 4px solid var(--gold);
}

header a {
  color: var(--gold);
  text-decoration: none;
  margin-right: 12px;
}

main {
  width: min(1100px, 94%);
  margin: 24px auto;
}

.card {
  background: white;
  border: 1px solid #d9e2ef;
  border-top: 5px solid var(--gold);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 5px 18px #0714260d;
}

h1, h2, h3 { color: var(--navy); }

label {
  display: block;
  font-weight: bold;
  margin: 12px 0 5px;
}

input, select, textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #bbc8d8;
  border-radius: 8px;
  font-size: 16px;
  background: white;
  color: var(--text);
}

button {
  border: 0;
  border-radius: 8px;
  padding: 11px 15px;
  margin: 8px 5px 0 0;
  background: var(--gold);
  color: var(--navy);
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button.secondary { background: var(--blue); color: white; }
button.danger { background: #8d2020; color: white; }
button:disabled { opacity: .55; cursor: not-allowed; }

.status, .error {
  padding: 12px;
  border-radius: 8px;
  margin: 12px 0;
  overflow-wrap: anywhere;
}

.status { background: var(--green); color: #155724; }
.error { background: var(--red); color: #8d2020; }

.hidden { display: none !important; }

.muted {
  font-size: 13px;
  color: #657386;
  overflow-wrap: anywhere;
}

.item {
  border: 1px solid #d9e2ef;
  border-radius: 10px;
  padding: 16px;
  margin: 14px 0;
  overflow-wrap: anywhere;
}

.item p { margin: 7px 0; }

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  padding: 12px;
  border-radius: 8px;
}

.badge {
  display: inline-block;
  padding: 4px 9px;
  background: #eef2f8;
  border-radius: 20px;
  font-size: 13px;
}

@media (max-width: 650px) {
  .grid { grid-template-columns: 1fr; }
  main { width: 94%; }
  .card { padding: 15px; }
}
</style>
</head>

<body>

<header>
  <strong>NGSF — Admin Approval</strong>
  <p>
    <a href="index.html">Home</a>
    <a href="membership.html">Membership</a>
  </p>
</header>

<main>

  <section class="card">
    <h1>Membership Approval Dashboard</h1>
    <p>ਇਹ ਪੇਜ ਸਿਰਫ਼ ਅਧਿਕਾਰਤ NGSF Admin ਲਈ ਹੈ।</p>

    <div id="loginArea">
      <label for="email">Admin Email</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="Admin email"
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Password"
      >

      <button id="loginBtn">Admin Login</button>
      <button id="resetBtn" class="secondary">Forgot Password</button>
    </div>

    <div id="adminArea" class="hidden">
      <p id="adminIdentity" class="status"></p>
      <button id="reloadBtn">Refresh Applications</button>
      <button id="logoutBtn" class="danger">Sign Out</button>
    </div>

    <div id="message" role="status" aria-live="polite"></div>
  </section>

  <section id="dashboard" class="card hidden">
    <h2>Membership Applications</h2>

    <div class="grid">
      <div>
        <label for="filterStatus">Filter by Status</label>
        <select id="filterStatus">
          <option value="">All statuses</option>
          <option value="Pending">Pending</option>
          <option value="Under Review">Under Review</option>
          <option value="Approved">Approved</option>
          <option value="Rejected">Rejected</option>
        </select>
      </div>

      <div>
        <label for="search">Search Applications</label>
        <input
          id="search"
          type="search"
          placeholder="Name, email, phone or ID"
        >
      </div>
    </div>

    <p class="muted">
      ਸਿਰਫ਼ ਉਹੀ applications ਦਿਖਾਈਆਂ ਜਾਣਗੀਆਂ ਜਿਨ੍ਹਾਂ ਨੂੰ
      Supabase RLS policies ਪੜ੍ਹਨ ਦੀ ਇਜਾਜ਼ਤ ਦਿੰਦੀਆਂ ਹਨ।
    </p>

    <div id="applications">Login ਤੋਂ ਬਾਅਦ applications ਦਿਖਾਈਆਂ ਜਾਣਗੀਆਂ।</div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

/* ==========================================
   SUPABASE CONFIGURATION
   ========================================== */

const SUPABASE_URL =
  "https://oqelvpojoaylmwdbmwcn.supabase.co";

/*
  ਇੱਥੇ ਆਪਣੀ Supabase Publishable Key ਪਾਓ।
  sb_publishable_... ਜਾਂ ਪੁਰਾਣੀ anon public key ਵਰਤੋ।
  service_role ਜਾਂ sb_secret_... ਕਦੇ ਨਾ ਪਾਓ।
*/

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_rgbSAlgeSBnVaBtYWlQOdA_ltIW3Hka";

const ALLOWED_STATUSES = [
  "Pending",
  "Under Review",
  "Approved",
  "Rejected"
];

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const $ = id => document.getElementById(id);

let currentUser = null;
let allApplications = [];
let busy = false;
let authCheckRunning = false;

/* ==========================================
   MESSAGES
   ========================================== */

function message(text, isError = false) {
  const box = document.createElement("div");
  box.className = isError ? "error" : "status";
  box.textContent = text;

  $("message").replaceChildren(box);
}

function clearMessage() {
  $("message").replaceChildren();
}

function safeText(value) {
  return value === null || value === undefined || value === ""
    ? "—"
    : String(value);
}

/* ==========================================
   PAGE STATE
   ========================================== */

function setLoggedIn(user, isAdmin) {
  currentUser = isAdmin ? user : null;

  $("loginArea").classList.toggle("hidden", !!isAdmin);
  $("adminArea").classList.toggle("hidden", !isAdmin);
  $("dashboard").classList.toggle("hidden", !isAdmin);

  $("adminIdentity").textContent = isAdmin
    ? "Authorized Admin: " + safeText(user.email)
    : "";
}

/* ==========================================
   VERIFY ADMIN AGAINST DATABASE
   ========================================== */

async function verifyAdmin(user) {
  if (!user) {
    setLoggedIn(null, false);
    return false;
  }

  const { data, error } = await db
    .from("ngsf_admins")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();

  if (error) {
    setLoggedIn(null, false);
    await db.auth.signOut();
    message(
      "Admin verification failed. Supabase RLS policy ਜਾਂ table access ਚੈੱਕ ਕਰੋ: " +
      error.message,
      true
    );
    return false;
  }

  if (!data) {
    setLoggedIn(null, false);
    await db.auth.signOut();

    message(
      "Access denied. ਇਹ account ngsf_admins table ਵਿੱਚ authorized Admin ਨਹੀਂ ਹੈ।",
      true
    );
    return false;
  }

  setLoggedIn(user, true);
  message("Admin verification successful.");

  await loadApplications();
  return true;
}

/* ==========================================
   LOAD APPLICATIONS
   ========================================== */

async function loadApplications() {
  if (!currentUser) return;

  $("applications").textContent = "Applications ਲੋਡ ਹੋ ਰਹੀਆਂ ਹਨ…";
  $("reloadBtn").disabled = true;

  const { data, error } = await db
    .from("ngsf_member_registrations")
    .select(
      "id, user_id, full_name, gender, date_of_birth, father_name, profession, blood_group, state, district, mobile, whatsapp, address, pin_code, email, id_type, status, created_at"
    )
    .order("created_at", { ascending: false })
    .limit(200);

  $("reloadBtn").disabled = false;

  if (error) {
    $("applications").textContent = "";
    message(
      "Applications ਲੋਡ ਨਹੀਂ ਹੋਈਆਂ: " + error.message,
      true
    );
    return;
  }

  allApplications = data || [];
  renderApplications();
}

/* ==========================================
   RENDER APPLICATIONS
   ========================================== */

function renderApplications() {
  const target = $("applications");
  target.replaceChildren();

  const filter = $("filterStatus").value;
  const query = $("search").value.trim().toLowerCase();

  const rows = allApplications.filter(app => {
    const statusMatch = !filter || app.status === filter;

    const searchableText = [
      app.id,
      app.user_id,
      app.full_name,
      app.mobile,
      app.whatsapp,
      app.email,
      app.district,
      app.state,
      app.father_name,
      app.profession,
      app.status
    ].map(safeText).join(" ").toLowerCase();

    return statusMatch &&
      (!query || searchableText.includes(query));
  });

  if (!rows.length) {
    target.textContent = "ਇਸ filter ਲਈ ਕੋਈ application ਨਹੀਂ ਮਿਲੀ।";
    return;
  }

  rows.forEach(app => {
    const card = document.createElement("article");
    card.className = "item";

    const title = document.createElement("h3");
    title.textContent = safeText(app.full_name);

    const id = document.createElement("p");
    id.textContent = "Application ID: " + safeText(app.id);

    const submitted = document.createElement("p");
    submitted.textContent =
      "Submitted: " +
      (app.created_at
        ? new Date(app.created_at).toLocaleString()
        : "—");

    const details = document.createElement("pre");
    details.textContent =
      "Mobile: " + safeText(app.mobile) + "\n" +
      "WhatsApp: " + safeText(app.whatsapp) + "\n" +
      "Email: " + safeText(app.email) + "\n" +
      "District / State: " + safeText(app.district) + " / " + safeText(app.state) + "\n" +
      "Father name: " + safeText(app.father_name) + "\n" +
      "Profession: " + safeText(app.profession) + "\n" +
      "ID type: " + safeText(app.id_type);

    const currentStatus = document.createElement("p");
    currentStatus.append("Current Status: ");

    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = safeText(app.status);
    currentStatus.appendChild(badge);

    const statusLabel = document.createElement("label");
    statusLabel.textContent = "Change Application Status";

    const statusSelect = document.createElement("select");

    ALLOWED_STATUSES.forEach(status => {
      const option = document.createElement("option");
      option.value = status;
      option.textContent = status;
      statusSelect.appendChild(option);
    });

    statusSelect.value = ALLOWED_STATUSES.includes(app.status)
      ? app.status
      : "Pending";

    const saveButton = document.createElement("button");
    saveButton.textContent = "Save Status";

    saveButton.addEventListener("click", () => {
      updateStatus(app, statusSelect, saveButton);
    });

    card.append(
      title,
      id,
      submitted,
      details,
      currentStatus,
      statusLabel,
      statusSelect,
      saveButton
    );

    target.appendChild(card);
  });
}

/* ==========================================
   UPDATE STATUS
   ========================================== */

async function updateStatus(app, select, button) {
  if (busy || !currentUser) return;

  const newStatus = select.value;

  if (!ALLOWED_STATUSES.includes(newStatus)) {
    message("Invalid status.", true);
    return;
  }

  if (newStatus === app.status) {
    message("Status ਪਹਿਲਾਂ ਹੀ " + newStatus + " ਹੈ।");
    return;
  }

  const confirmed = confirm(
    "Application status ਨੂੰ '" + newStatus + "' ਕਰਨਾ ਹੈ?"
  );

  if (!confirmed) return;

  busy = true;
  button.disabled = true;
  clearMessage();

  try {
    const { data, error } = await db
      .from("ngsf_member_registrations")
      .update({ status: newStatus })
      .eq("id", app.id)
      .select("id, status")
      .maybeSingle();

    if (error) {
      message(
        "Status update ਨਹੀਂ ਹੋਇਆ: " + error.message +
        " — Supabase UPDATE RLS policy ਚੈੱਕ ਕਰੋ।",
        true
      );
      return;
    }

    if (!data) {
      message(
        "ਕੋਈ row update ਨਹੀਂ ਹੋਈ। Admin ਦੀ UPDATE RLS policy ਚੈੱਕ ਕਰੋ।",
        true
      );
      return;
    }

    message("Application status updated: " + data.status);
    await loadApplications();

  } catch (err) {
    message("Unexpected error: " + err.message, true);

  } finally {
    busy = false;
    button.disabled = false;
  }
}

/* ==========================================
   ADMIN LOGIN
   ========================================== */

$("loginBtn").addEventListener("click", async () => {
  if (busy) return;

  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || !password) {
    message("Admin email ਅਤੇ password ਭਰੋ।", true);
    return;
  }

  busy = true;
  $("loginBtn").disabled = true;
  clearMessage();

  try {
    const { data, error } = await db.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      message("Login failed: " + error.message, true);
      return;
    }

    await verifyAdmin(data.user);

  } catch (err) {
    message("Login error: " + err.message, true);

  } finally {
    busy = false;
    $("loginBtn").disabled = false;
  }
});

/* ==========================================
   FORGOT PASSWORD
   ========================================== */

$("resetBtn").addEventListener("click", async () => {
  const email = $("email").value.trim();

  if (!email) {
    message("ਪਹਿਲਾਂ Admin email ਭਰੋ।", true);
    return;
  }

  const redirectTo =
    window.location.origin +
    window.location.pathname.replace(
      /[^/]*$/,
      "reset-password.html"
    );

  $("resetBtn").disabled = true;

  try {
    const { error } = await db.auth.resetPasswordForEmail(email, {
      redirectTo
    });

    if (error) {
      message("Password reset request failed: " + error.message, true);
      return;
    }

    message(
      "ਜੇ ਇਸ email ਲਈ account ਮੌਜੂਦ ਹੈ, ਤਾਂ password reset instructions ਭੇਜਣ ਦੀ ਬੇਨਤੀ ਹੋ ਗਈ ਹੈ। ਆਪਣਾ Inbox ਅਤੇ Spam ਚੈੱਕ ਕਰੋ।"
    );

  } catch (err) {
    message("Error: " + err.message, true);

  } finally {
    $("resetBtn").disabled = false;
  }
});

/* ==========================================
   REFRESH / FILTER / SEARCH
   ========================================== */

$("reloadBtn").addEventListener("click", loadApplications);

$("filterStatus").addEventListener("change", renderApplications);

$("search").addEventListener("input", renderApplications);

/* ==========================================
   SIGN OUT
   ========================================== */

$("logoutBtn").addEventListener("click", async () => {
  if (busy) return;

  const { error } = await db.auth.signOut();

  if (error) {
    message("Sign out failed: " + error.message, true);
    return;
  }

  allApplications = [];
  setLoggedIn(null, false);
  $("applications").textContent =
    "Login ਤੋਂ ਬਾਅਦ applications ਦਿਖਾਈਆਂ ਜਾਣਗੀਆਂ।";

  message("ਤੁਸੀਂ ਸਫਲਤਾਪੂਰਵਕ Sign Out ਹੋ ਗਏ ਹੋ।");
});

/* ==========================================
   INITIALIZE SESSION
   ========================================== */

async function initialize() {
  if (authCheckRunning) return;

  authCheckRunning = true;

  try {
    const { data, error } = await db.auth.getSession();

    if (error) {
      message("Session error: " + error.message, true);
      return;
    }

    if (data.session) {
      await verifyAdmin(data.session.user);
    } else {
      setLoggedIn(null, false);
    }

  } catch (err) {
    message("Initialization error: " + err.message, true);

  } finally {
    authCheckRunning = false;
  }
}

/* ==========================================
   KEY VALIDATION AND STARTUP
   ========================================== */

if (
  !SUPABASE_URL.startsWith("https://") ||
  !SUPABASE_PUBLISHABLE_KEY ||
  SUPABASE_PUBLISHABLE_KEY.includes("PASTE_YOUR_") ||
  SUPABASE_PUBLISHABLE_KEY.startsWith("sb_secret_")
) {
  message(
    "Supabase URL ਜਾਂ Publishable Key ਠੀਕ ਤਰ੍ਹਾਂ ਨਹੀਂ ਭਰੀ ਗਈ। Project Settings ਤੋਂ public Publishable Key ਪਾਓ।",
    true
  );
} else {
  initialize();
}
</script>

</body>
</html>
