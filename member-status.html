
<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071426">
<title>Member Status | NGSF</title>
<style>
:root{--navy:#071426;--blue:#0B2D59;--gold:#F5C542;--light:#F3F6FB;--text:#26364B}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--light);color:var(--text);line-height:1.6}
header{background:var(--navy);color:white;padding:18px 5%;border-bottom:4px solid var(--gold)}
header a{color:var(--gold);text-decoration:none}
main{width:min(850px,92%);margin:28px auto}
.card{background:white;border:1px solid #d9e2ef;border-top:5px solid var(--gold);border-radius:14px;padding:22px;margin-bottom:20px;box-shadow:0 5px 18px #0714260d}
h1,h2{color:var(--navy)}
label{display:block;font-weight:bold;margin:12px 0 5px}
input{width:100%;padding:13px;border:1px solid #bbc8d8;border-radius:8px;font-size:16px}
button,.btn{display:inline-block;border:0;border-radius:8px;padding:12px 17px;margin-top:14px;background:var(--gold);color:var(--navy);font-size:16px;font-weight:bold;cursor:pointer}
button.secondary{background:var(--blue);color:white}
button.danger{background:#8d2020;color:white}
.status{padding:12px;border-radius:8px;background:#e8f6ec;margin:12px 0;overflow-wrap:anywhere}
.error{background:#ffeded;color:#8d2020;padding:12px;border-radius:8px;margin:12px 0;overflow-wrap:anywhere}
.muted{color:#657386;font-size:14px}
.item{border:1px solid #d9e2ef;border-radius:10px;padding:15px;margin:12px 0}
.badge{display:inline-block;background:#fff3c4;color:#503c00;padding:4px 10px;border-radius:20px;font-weight:bold}
.hidden{display:none}
a{color:var(--blue)}
</style>
</head>
<body>
<header>
  <strong>New Granthi Singh Federation</strong><br>
  <a href="index.html">Home</a> · <a href="membership.html">Membership</a>
</header>

<main>
  <section class="card">
    <h1>Member Status</h1>
    <p>ਆਪਣੀ Membership Application ਦਾ status ਵੇਖਣ ਲਈ ਆਪਣੇ Member Account ਵਿੱਚ Login ਕਰੋ।</p>

    <div id="loginArea">
      <label for="email">Email Address</label>
      <input id="email" type="email" autocomplete="username" required placeholder="ਤੁਹਾਡੀ registered email">

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required placeholder="Password">

      <button id="loginBtn">Login</button>
      <button id="resetBtn" class="secondary">Forgot Password</button>
    </div>

    <div id="accountArea" class="hidden">
      <p class="status" id="signedIn"></p>
      <button id="refreshBtn">Refresh Status</button>
      <button id="logoutBtn" class="danger">Sign Out</button>
    </div>

    <div id="message" role="status" aria-live="polite"></div>
  </section>

  <section class="card">
    <h2>ਮੇਰੀਆਂ ਅਰਜ਼ੀਆਂ</h2>
    <p class="muted">ਇੱਥੇ ਸਿਰਫ਼ ਤੁਹਾਡੇ ਆਪਣੇ account ਨਾਲ ਜੁੜੀਆਂ ਅਰਜ਼ੀਆਂ ਦਿਖਾਈਆਂ ਜਾਣਗੀਆਂ।</p>
    <div id="applications"><p>ਪਹਿਲਾਂ Login ਕਰੋ।</p></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://oqelvpojoaylmwdbmwcn.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_rgbSAlgeSBnVaBtYWlQOdA_ltIW3Hka";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const $ = id => document.getElementById(id);
let currentUser = null;
let busy = false;

function showMessage(text, isError=false) {
  $("message").innerHTML = "";
  const box = document.createElement("div");
  box.className = isError ? "error" : "status";
  box.textContent = text;
  $("message").appendChild(box);
}
function clearMessage(){ $("message").innerHTML = ""; }

function formatDate(value) {
  if (!value) return "—";
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? "—" : d.toLocaleString();
}

function setSignedIn(user) {
  currentUser = user || null;
  $("loginArea").classList.toggle("hidden", !!user);
  $("accountArea").classList.toggle("hidden", !user);
  $("signedIn").textContent = user ? "Logged in as " + user.email : "";
}

async function loadApplications() {
  if (!currentUser) {
    $("applications").textContent = "ਪਹਿਲਾਂ Login ਕਰੋ।";
    return;
  }

  $("applications").textContent = "Applications ਲੋਡ ਹੋ ਰਹੀਆਂ ਹਨ…";

  const { data, error } = await db
    .from("ngsf_member_registrations")
    .select("id, full_name, mobile, district, state, status, created_at")
    .eq("user_id", currentUser.id)
    .order("created_at", { ascending: false });

  if (error) {
    $("applications").textContent = "";
    showMessage("Status ਲੋਡ ਨਹੀਂ ਹੋਇਆ: " + error.message, true);
    return;
  }

  $("applications").textContent = "";

  if (!data || data.length === 0) {
    $("applications").textContent =
      "ਤੁਹਾਡੇ account ਨਾਲ ਕੋਈ membership application ਨਹੀਂ ਮਿਲੀ।";
    return;
  }

  data.forEach(app => {
    const card = document.createElement("article");
    card.className = "item";

    const title = document.createElement("h3");
    title.textContent = app.full_name || "Membership Application";

    const status = document.createElement("p");
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = app.status || "Pending";
    status.append("Status: ", badge);

    const details = document.createElement("p");
    details.textContent = "Mobile: " + (app.mobile || "—") + " · District: " + (app.district || "—") + " · State: " + (app.state || "—");

    const date = document.createElement("p");
    date.textContent = "Submitted: " + formatDate(app.created_at);

    const ref = document.createElement("p");
    ref.className = "muted";
    ref.textContent = "Application ID: " + app.id;

    card.append(title, status, details, date, ref);
    $("applications").appendChild(card);
  });
}

$("loginBtn").addEventListener("click", async () => {
  if (busy) return;
  const email = $("email").value.trim();
  const password = $("password").value;
  if (!email || !password) return showMessage("Email ਅਤੇ Password ਭਰੋ।", true);

  busy = true;
  $("loginBtn").disabled = true;
  clearMessage();

  const { data, error } = await db.auth.signInWithPassword({ email, password });

  busy = false;
  $("loginBtn").disabled = false;

  if (error) return showMessage(error.message, true);
  setSignedIn(data.user);
  showMessage("Login successful.");
  await loadApplications();
});

$("resetBtn").addEventListener("click", async () => {
  const email = $("email").value.trim();
  if (!email) return showMessage("ਪਹਿਲਾਂ Email Address ਭਰੋ।", true);

  const redirectTo = location.origin + location.pathname.replace(
    /[^/]*$/, "reset-password.html"
  );

  const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo });
  if (error) return showMessage(error.message, true);
  showMessage("ਜੇ ਇਹ email account ਮੌਜੂਦ ਹੈ, ਤਾਂ password reset instructions ਭੇਜਣ ਦੀ ਬੇਨਤੀ ਹੋ ਗਈ ਹੈ।");
});

$("refreshBtn").addEventListener("click", loadApplications);

$("logoutBtn").addEventListener("click", async () => {
  const { error } = await db.auth.signOut();
  if (error) return showMessage(error.message, true);
  setSignedIn(null);
  $("applications").textContent = "ਪਹਿਲਾਂ Login ਕਰੋ।";
  showMessage("ਤੁਸੀਂ Sign Out ਹੋ ਗਏ ਹੋ।");
});

async function initialize() {
  const { data, error } = await db.auth.getSession();
  if (error) return showMessage(error.message, true);
  if (data.session) {
    setSignedIn(data.session.user);
    await loadApplications();
  }
}

db.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_OUT") {
    setSignedIn(null);
    $("applications").textContent = "ਪਹਿਲਾਂ Login ਕਰੋ।";
  }
});

if (!SUPABASE_PUBLISHABLE_KEY || SUPABASE_PUBLISHABLE_KEY.includes("PASTE_YOUR_") || SUPABASE_PUBLISHABLE_KEY.startsWith("sb_secret_")) {
  showMessage("ਕੋਡ ਵਿੱਚ ਆਪਣੀ Supabase publishable key ਪਾਓ।", true);
} else {
  initialize();
}
</script>
</body>
</html>
